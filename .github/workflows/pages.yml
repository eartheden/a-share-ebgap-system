name: Deploy to GitHub Pages (legacy · 手动)

# ⚠️ 已废弃自动发布：这个站早已不是纯前端。
# 登录门 / RBAC / 行情代理 / 虚拟持仓 API 全部依赖 server.py，
# 纯静态托管会把访客卡在登录页（/api/auth/me 404），不可用。
# 线上发布走 workbuddy_sites_deploy（带 Python 后端），不走这里。
# 保留本文件仅为历史回溯，故移除 push 自动触发，只留手动。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 这个站是纯前端：行情走东财 JSONP 直连，持仓/建议在浏览器本地存。
      # 只把页面资源挑出来发布，server.py 这类本地后端脚本不带上线。
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp ai.js app.js data.js echarts.min.js fundamental.js live.js picker.js stock.js stocks.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
